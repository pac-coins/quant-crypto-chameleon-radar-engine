name: CI (Tests, Docs & Governance Guardrails)

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-guardrails:
    name: Pytest + Strategies Governance Guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify config/strategies.yaml frozen SHA-256 (ADR-009 / K9.3)
        run: |
          EXPECTED_SHA256="36e8d5fd7f4066ec80b4fefbaa7fbda2631a92b95254e0b079ba17f0c92b8f7d"
          ACTUAL_SHA256="$(sha256sum config/strategies.yaml | awk '{print $1}')"
          echo "Expected: ${EXPECTED_SHA256}"
          echo "Actual:   ${ACTUAL_SHA256}"
          if [ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::config/strategies.yaml foi alterado! Ele esta congelado para K9.3 / Fase 1 (ADR-009). So atualize o hash apos aprovacao formal de gate."
            exit 1
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run full pytest suite
        run: pytest -q

  docs-strict:
    name: MkDocs Strict Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-docs.txt

      - name: Validate MkDocs build (--strict)
        run: mkdocs build --strict
