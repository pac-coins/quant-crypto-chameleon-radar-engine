site_name: QuantCrypto Chameleon & Radar Engine
site_description: Arquitetura unificada, auditoria de integração, contrato de dados e metodologia do QuantCrypto Chameleon & Radar Engine
site_url: https://pac-coins.github.io/quant-crypto-chameleon-radar-engine/
repo_url: https://github.com/pac-coins/quant-crypto-chameleon-radar-engine
repo_name: pac-coins/quant-crypto-chameleon-radar-engine

theme:
  name: material
  language: pt
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Usar modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Usar modo claro

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Início: index.md
  - Arquitetura Unificada: unified-architecture.md
  - Executor (Chameleon v6): architecture.md
  - Radar & Auditor (v1.1): radar.md
  - Auditoria de Integração: integration-audit.md
  - Contrato de Dados (SQLite): data-contract.md
  - Especificação do Bloco 1: block-1-spec.md
  - Especificação do Bloco 2: block-2-spec.md
  - Especificação do Bloco 3: block-3-spec.md
  - Especificação do Bloco 4: block-4-spec.md
  - Decisões (ADR): decisions.md
  - Metodologia e roadmap: methodology-and-roadmap.md
  - TODO: todo.md
  - Histórico:
      - Migração v5 → v6: v5-to-v6.md
      - v5: v5.md
