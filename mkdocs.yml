site_name: QuantCrypto Chameleon & Radar Engine
site_description: Arquitetura, operação, governança quantitativa e auditorias do QuantCrypto Chameleon & Radar Engine
site_url: https://pac-coins.github.io/quant-crypto-chameleon-radar-engine/
repo_url: https://github.com/pac-coins/quant-crypto-chameleon-radar-engine
repo_name: pac-coins/quant-crypto-chameleon-radar-engine

theme:
  name: material
  language: pt
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Usar modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Usar modo claro

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Início:
      - Visão Geral: index.md
      - Guia Rápido e Transição de Gates: quickstart.md
  - Operação:
      - Runbook de Incidentes: runbook.md
      - Backup e Restauração: backup-and-restore.md
  - Arquitetura & Referência:
      - Arquitetura Unificada (Canônica): unified-architecture.md
      - Contrato de Dados (SQLite WAL): data-contract.md
      - Executor (Chameleon v6.0): architecture.md
      - Radar & Auditor Virtual (v1.1): radar.md
  - Governança & Pesquisa:
      - Metodologia e Roadmap: methodology-and-roadmap.md
      - Decisões Arquiteturais (ADR): decisions.md
      - ADR-016 — Regra de Decisão do Gate 6B: adr-016-regra-de-decisao-6b.md
      - Próximos Passos e Pré-mortem: next-steps.md
      - Auditoria do Backtest e Edge (K9.3): backtest-edge-audit.md
  - Auditorias & Histórico:
      - Auditoria de Integração (C1/C2): integration-audit.md
      - Auditoria Adversarial (2026-11-23): audit-2026-11-23.md
      - Remediação da Auditoria (2026-11-23): audit-2026-11-23-remediation.md
      - Especificações dos Blocos 1–6:
          - Bloco 1 — Fundação & Dados: block-1-spec.md
          - Bloco 2 — Features & MECE: block-2-spec.md
          - Bloco 3 — Backtest, DSR & K9.3: block-3-spec.md
          - Bloco 4 — Risco, CPPI & MLJudge: block-4-spec.md
          - Bloco 5 — OCO & Reconciliador: block-5-spec.md
          - Bloco 6 — Radar, Auditor & Main: block-6-spec.md
      - Quadro TODO (Histórico): todo.md
      - Migração v5 → v6: v5-to-v6.md
      - Arquitetura v5 (Legado): v5.md
